name: verify

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-gate:
    runs-on: macos-15
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run core verification
        run: ./scripts/verify.sh

  mega:
    runs-on: macos-15
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Restore pinned Mega Backend source
        id: mega-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/fachtracing-mega-backend
          key: mega-backend-${{ runner.os }}-782cdec8dfe5b4062eb5c1859e6a9e53afe02770
      - name: Prepare pinned Mega Backend source
        if: steps.mega-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/Gepardec/mega-backend.git "${{ runner.temp }}/fachtracing-mega-backend"
          git -C "${{ runner.temp }}/fachtracing-mega-backend" checkout -q 782cdec8dfe5b4062eb5c1859e6a9e53afe02770
      - name: Build Fachtracing classes
        run: mvn -q -DskipTests package
      - name: Run Mega Backend conformance
        env:
          FACHTRACING_SKIP_PROJECT_BUILD: 'true'
          MEGA_BACKEND_DIR: ${{ runner.temp }}/fachtracing-mega-backend
        run: ./scripts/verify-mega-backend.sh

  petclinic:
    runs-on: macos-15
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Restore pinned Spring PetClinic source
        id: petclinic-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/fachtracing-spring-petclinic
          key: spring-petclinic-${{ runner.os }}-88e37c15cf6fc8490b01bc3e8e2c800cec1ac272
      - name: Prepare pinned Spring PetClinic source
        if: steps.petclinic-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/spring-projects/spring-petclinic.git "${{ runner.temp }}/fachtracing-spring-petclinic"
          git -C "${{ runner.temp }}/fachtracing-spring-petclinic" checkout -q 88e37c15cf6fc8490b01bc3e8e2c800cec1ac272
      - name: Build Fachtracing classes
        run: mvn -q -DskipTests package
      - name: Run Spring PetClinic conformance
        env:
          FACHTRACING_SKIP_PROJECT_BUILD: 'true'
          SPRING_PETCLINIC_DIR: ${{ runner.temp }}/fachtracing-spring-petclinic
        run: ./scripts/verify-spring-petclinic.sh

  jakartaee-rest:
    runs-on: macos-15
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Restore pinned Jakarta EE REST source
        id: jakartaee-rest-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/fachtracing-jakartaee-rest-sample
          key: jakartaee-rest-${{ runner.os }}-85da1d6861fea14579b1c6eb76253f0549a8e80f
      - name: Prepare pinned Jakarta EE REST source
        if: steps.jakartaee-rest-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/hantsy/jakartaee-rest-sample.git "${{ runner.temp }}/fachtracing-jakartaee-rest-sample"
          git -C "${{ runner.temp }}/fachtracing-jakartaee-rest-sample" checkout -q 85da1d6861fea14579b1c6eb76253f0549a8e80f
      - name: Build Fachtracing classes
        run: mvn -q -DskipTests package
      - name: Run Jakarta EE REST conformance
        env:
          FACHTRACING_SKIP_PROJECT_BUILD: 'true'
          JAKARTAEE_REST_SAMPLE_DIR: ${{ runner.temp }}/fachtracing-jakartaee-rest-sample
        run: ./scripts/verify-jakartaee-rest.sh

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: fachtracing
          POSTGRES_USER: fachtracing
          POSTGRES_PASSWORD: fachtracing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fachtracing -d fachtracing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fachtracing-viewer/package-lock.json
      - name: Run PostgreSQL storage contract
        env:
          FACHTRACING_POSTGRES_URL: jdbc:postgresql://localhost:5432/fachtracing
          FACHTRACING_POSTGRES_USER: fachtracing
          FACHTRACING_POSTGRES_PASSWORD: fachtracing
        run: ./scripts/verify-postgres.sh
      - name: Run viewer verification
        run: ./scripts/verify-viewer.sh
      - name: Generate Fachtracing viewer dogfood
        run: ./scripts/verify-viewer-dogfood.sh
      - name: Run viewer PostgreSQL journey
        working-directory: fachtracing-viewer
        env:
          FACHTRACING_DATABASE_URL: postgresql://fachtracing:fachtracing@localhost:5432/fachtracing
          FACHTRACING_DOGFOOD_DIRECTORY: ${{ github.workspace }}/target/viewer-dogfood
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run test:browser
      - name: Upload Fachtracing viewer proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fachtracing-viewer-dogfood-${{ github.run_id }}
          path: fachtracing-viewer/test-results
          if-no-files-found: error
          retention-days: 14
